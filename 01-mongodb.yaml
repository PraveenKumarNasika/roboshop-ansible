- name: configure mongodb server
  hosts: mongodb
  become: yes
  tasks:
  - name: copy mongo repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
  - name: install mongodb server
    package:
      name: mongodb-org
      state: present
  - name: allow remote connections
    replace:
        path: /etc/mongod.conf
        regexp: '127.0.0.0'
        replace: '0.0.0.0'
  - name: start & enable mongodb server
    service: 
      name: mongod
      state: started
      enabled: yes 

